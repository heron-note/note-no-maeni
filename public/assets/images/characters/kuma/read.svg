<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- 耳 -->
  <circle cx="58" cy="52" r="26" fill="#8B6346"/>
  <circle cx="142" cy="52" r="26" fill="#8B6346"/>
  <circle cx="58" cy="52" r="16" fill="#C49A6C"/>
  <circle cx="142" cy="52" r="16" fill="#C49A6C"/>
  <!-- 頭（少し横向き気味） -->
  <ellipse cx="100" cy="100" rx="68" ry="64" fill="#8B6346"/>
  <!-- 顔の白い部分 -->
  <ellipse cx="100" cy="112" rx="42" ry="36" fill="#E8D5BC"/>
  <!-- 目（のんびり：細め） -->
  <path d="M 72 92 Q 80 86 88 92" stroke="#3A2010" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 112 92 Q 120 86 128 92" stroke="#3A2010" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 鼻 -->
  <ellipse cx="100" cy="108" rx="8" ry="5" fill="#4A2F1A"/>
  <!-- 口（ほんわか） -->
  <path d="M 90 118 Q 100 126 110 118" stroke="#4A2F1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- ほっぺ -->
  <ellipse cx="72" cy="108" rx="12" ry="8" fill="#F4A0A0" opacity="0.6"/>
  <ellipse cx="128" cy="108" rx="12" ry="8" fill="#F4A0A0" opacity="0.6"/>
  <!-- 体 -->
  <ellipse cx="100" cy="185" rx="46" ry="38" fill="#8B6346"/>
  <!-- 両手で本を持つ -->
  <ellipse cx="52" cy="175" rx="20" ry="13" fill="#8B6346" transform="rotate(-15 52 175)"/>
  <ellipse cx="148" cy="175" rx="20" ry="13" fill="#8B6346" transform="rotate(15 148 175)"/>
  <!-- 本 -->
  <rect x="62" y="190" width="76" height="14" rx="3" fill="#4A90D9"/>
  <line x1="100" y1="190" x2="100" y2="204" stroke="#2A5A8A" stroke-width="2"/>
</svg>
