  <!-- 口（にっこり） -->
  <path d="M 86 118 Q 100 130 114 118" stroke="#4A2F1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- ほっぺ -->
  <ellipse cx="72" cy="108" rx="12" ry="8" fill="#F4A0A0" opacity="0.6"/>
  <ellipse cx="128" cy="108" rx="12" ry="8" fill="#F4A0A0" opacity="0.6"/>
  <!-- 体 -->
  <ellipse cx="100" cy="185" rx="46" ry="38" fill="#8B6346"/>
  <!-- 左手（前に出す：背中を押すポーズ） -->
  <ellipse cx="52" cy="165" rx="20" ry="14" fill="#8B6346" transform="rotate(-40 52 165)"/>
