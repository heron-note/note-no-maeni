  <!-- 目（やる気：少し細め） -->
  <path d="M 72 90 Q 80 84 88 90" stroke="#3A2010" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 112 90 Q 120 84 128 90" stroke="#3A2010" stroke-width="3" fill="none" stroke-linecap="round"/>
