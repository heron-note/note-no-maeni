  <ellipse cx="100" cy="116" rx="40" ry="34" fill="#FFF0F4"/>
  <!-- 目（のんびり細目） -->
  <path d="M 72 95 Q 80 89 88 95" stroke="#3A6040" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 112 95 Q 120 89 128 95" stroke="#3A6040" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 鼻 -->
  <ellipse cx="100" cy="112" rx="6" ry="4" fill="#C06080"/>
  <!-- 口（ゆるっと） -->
  <path d="M 92 119 Q 100 125 108 119" stroke="#C06080" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- ひげ -->
  <line x1="60" y1="112" x2="84" y2="114" stroke="#A08090" stroke-width="1.5" opacity="0.7"/>
  <line x1="60" y1="118" x2="84" y2="116" stroke="#A08090" stroke-width="1.5" opacity="0.7"/>
  <line x1="116" y1="114" x2="140" y2="112" stroke="#A08090" stroke-width="1.5" opacity="0.7"/>
  <line x1="116" y1="116" x2="140" y2="118" stroke="#A08090" stroke-width="1.5" opacity="0.7"/>
  <!-- ほっぺ -->
  <ellipse cx="72" cy="110" rx="11" ry="7" fill="#F4A0A0" opacity="0.5"/>
  <ellipse cx="128" cy="110" rx="11" ry="7" fill="#F4A0A0" opacity="0.5"/>
  <!-- 体 -->
  <ellipse cx="100" cy="188" rx="44" ry="36" fill="#F0C0CC"/>
