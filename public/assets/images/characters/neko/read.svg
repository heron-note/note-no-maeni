  <path d="M 144 200 Q 172 195 166 175 Q 160 158 148 162" stroke="#E8A0B0" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- 両手で本を持つ -->
  <ellipse cx="54" cy="177" rx="18" ry="12" fill="#F0C0CC" transform="rotate(-15 54 177)"/>
  <ellipse cx="146" cy="177" rx="18" ry="12" fill="#F0C0CC" transform="rotate(15 146 177)"/>
  <!-- 本 -->
  <rect x="64" y="192" width="72" height="13" rx="3" fill="#7AC0F0"/>
  <line x1="100" y1="192" x2="100" y2="205" stroke="#4A90C0" stroke-width="2"/>
