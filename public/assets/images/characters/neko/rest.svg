<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- 耳（ちょっと寝かせ気味） -->
  <polygon points="52,72 40,36 76,60" fill="#E8A0B0"/>
  <polygon points="148,72 160,36 124,60" fill="#E8A0B0"/>
  <polygon points="53,68 45,42 72,62" fill="#F8D0DC"/>
  <polygon points="147,68 155,42 128,62" fill="#F8D0DC"/>
  <!-- 頭 -->
  <ellipse cx="100" cy="104" rx="66" ry="62" fill="#F0C0CC"/>
  <!-- 顔の白い部分 -->
  <ellipse cx="100" cy="116" rx="40" ry="34" fill="#FFF0F4"/>
  <!-- 目（閉じてる：弧） -->
  <path d="M 72 96 Q 80 102 88 96" stroke="#3A6040" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 112 96 Q 120 102 128 96" stroke="#3A6040" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 鼻 -->
  <ellipse cx="100" cy="112" rx="6" ry="4" fill="#C06080"/>
  <!-- 口（へにゃ笑い） -->
  <path d="M 92 119 Q 100 125 108 119" stroke="#C06080" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- ひげ -->
  <line x1="60" y1="113" x2="84" y2="114" stroke="#A08090" stroke-width="1.5" opacity="0.6"/>
  <line x1="60" y1="119" x2="84" y2="117" stroke="#A08090" stroke-width="1.5" opacity="0.6"/>
  <line x1="116" y1="114" x2="140" y2="113" stroke="#A08090" stroke-width="1.5" opacity="0.6"/>
  <line x1="116" y1="117" x2="140" y2="119" stroke="#A08090" stroke-width="1.5" opacity="0.6"/>
  <!-- ほっぺ（強め） -->
  <ellipse cx="70" cy="110" rx="13" ry="9" fill="#F4A0A0" opacity="0.7"/>
  <ellipse cx="130" cy="110" rx="13" ry="9" fill="#F4A0A0" opacity="0.7"/>
  <!-- Zzzマーク -->
  <text x="136" y="78" font-family="Arial" font-size="14" font-weight="bold" fill="#C086A0" opacity="0.8">z</text>
  <text x="148" y="66" font-family="Arial" font-size="11" font-weight="bold" fill="#C086A0" opacity="0.6">z</text>
  <text x="158" y="56" font-family="Arial" font-size="9" font-weight="bold" fill="#C086A0" opacity="0.4">z</text>
  <!-- 体 -->
  <ellipse cx="100" cy="188" rx="44" ry="36" fill="#F0C0CC"/>
  <!-- 尻尾（まったり） -->
  <path d="M 144 202 Q 166 196 162 180 Q 158 166 150 172" stroke="#E8A0B0" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- 手（だらん） -->
  <ellipse cx="52" cy="186" rx="18" ry="11" fill="#F0C0CC" transform="rotate(10 52 186)"/>
  <ellipse cx="148" cy="186" rx="18" ry="11" fill="#F0C0CC" transform="rotate(-10 148 186)"/>
</svg>
