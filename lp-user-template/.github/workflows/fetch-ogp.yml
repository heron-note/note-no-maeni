name: Fetch note article OGP

on:
  workflow_dispatch:
    inputs:
      url:
        description: "note記事のURL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch-ogp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch OGP and update articles.json
        env:
          ARTICLE_URL: ${{ github.event.inputs.url }}
        run: node scripts/fetch-ogp.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update articles.json via fetch-ogp"
          git push
